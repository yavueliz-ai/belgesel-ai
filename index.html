<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belgesel AI v4.0</title>

<style>
*{box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0b0d;
  color:#f5f5f5;
  margin:0;
  padding:22px
}

.wrap{max-width:760px;margin:auto}
h1{margin-bottom:8px}
small{color:#999;font-size:14px}

.card{

  border-radius:18px;
  padding:18px;
  margin:14px 0
}

input,button,select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  font-size:16px
}

input,select{
  background:#0e0e11;
  color:white;
  margin:8px 0 12px

button{
  background:#efefef;
  color:#111;
  font-weight:700;
  cursor:pointer;
  margin-top:10px
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.muted{color:#aaa}

.status{
  margin-top:14px;
  white-space:pre-wrap;
  line-height:1.5
}

.story{
  background:#0e0e11;
  border:1px solid #29292f;
  border-radius:14px;
  padding:14px;
  margin-top:14px
}

.scene{
  margin-top:18px;
  overflow:hidden;
  border-radius:16px;
  background:#0e0e11;
  border:1px solid #29292f
}

.scene img{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  display:block
}

.sceneText{
  padding:14px;
  line-height:1.5
}

.sceneNumber{
  font-weight:800;
  margin-bottom:8px
}

.progress{
  height:8px;
  background:#26262b;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px
}

.progressBar{
  height:100%;
  width:0%;
  background:#eee;
  transition:width .3s
}
