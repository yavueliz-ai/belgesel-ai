<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belgesel AI v4.1</title>

<style>
*{box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0b0d;
  color:#f5f5f5;
  margin:0;
  padding:22px
}

.wrap{
  max-width:760px;
  margin:auto
}

h1{margin-bottom:8px}

small{
  color:#999;
  font-size:14px
}

.card{
  background:#151518;
  border:1px solid #2a2a30;
  border-radius:18px;
  padding:18px;
  margin:14px 0
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  font-size:16px
}

input{
  background:#0e0e11;
  color:white;
  margin:8px 0 12px
}

button{
  background:#efefef;
  color:#111;
  font-weight:700;
  cursor:pointer;
  margin-top:10px
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.muted{color:#aaa}

.status{
  margin-top:14px;
  white-space:pre-wrap;
  line-height:1.5
}

.story{
  background:#0e0e11;
  border:1px solid #29292f;
  border-radius:14px;
  padding:14px;
  margin-top:14px
}

.scene{
  margin-top:18px;
  overflow:hidden;
  border-radius:16px;
  background:#0e0e11;
  border:1px solid #29292f
}

.scene img{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  display:block
}

.sceneText{
  padding:14px;
  line-height:1.5
}

.sceneNumber{
  font-weight:800;
  margin-bottom:8px
}

.progress{
  height:8px;
  background:#26262b;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px
}

.progressBar{
  height:100%;
  width:0%;
  background:#eee;
  transition:width .3s
}

video{
  width:100%;
  border-radius:16px;
  margin-top:16px;
  background:black;
  aspect-ratio:9/16
}

audio{
  width:100%;
  margin-top:15px
}

.download{
  display:block;
  text-decoration:none;
  background:#efefef;
  color:#111;
  font-weight:800;
  text-align:center;
  padding:14px;
  border-radius:12px;
  margin-top:12px
}

.hidden{display:none}
</style>
</head>

<body>

<div class="wrap">

<h1>🎬 Belgesel AI <small>v4.1</small></h1>

<p class="muted">
Konuyu yaz. Belgesel AI senaryoyu, sahneleri, dikey görselleri,
Türkçe seslendirmeyi ve Shorts videosunu hazırlasın.
</p>

<div class="card">

<label>Belgesel konusu</label>

<input
  id="topic"
  value="Tomris Hatun"
  placeholder="Örnek: Piri Reis"
>

<label>Sahne sayısı</label>

<input
  id="count"
  type="number"
  value="6"
  min="3"
  max="8"
>

<button id="storyBtn">
1 — HİKÂYE VE SAHNELERİ OLUŞTUR
</button>

<button id="imageBtn" class="hidden">
2 — TÜM GÖRSELLERİ ÜRET
</button>

<button id="audioBtn" class="hidden">
3 — TÜRKÇE SESLENDİRMEYİ HAZIRLA
</button>

<button id="videoBtn" class="hidden">
4 — SHORTS VİDEOSUNU OLUŞTUR
</button>

<div class="progress">
  <div id="progressBar" class="progressBar"></div>
</div>

<div id="status" class="status muted"></div>

<div id="storyArea"></div>

<div id="results"></div>

<div id="audioArea"></div>

<div id="videoArea"></div>

</div>
</div>

<script>

const storyBtn = document.getElementById("storyBtn");
const imageBtn = document.getElementById("imageBtn");
const audioBtn = document.getElementById("audioBtn");
const videoBtn = document.getElementById("videoBtn");

const status = document.getElementById("status");
const storyArea = document.getElementById("storyArea");
const results = document.getElementById("results");
const audioArea = document.getElementById("audioArea");
const videoArea = document.getElementById("videoArea");
const progressBar = document.getElementById("progressBar");

let currentStory = null;
let generatedImages = [];
let generatedAudio = null;

function setProgress(value){
  progressBar.style.width = value + "%";
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}


/* =========================================================
   1 — HİKÂYE
========================================================= */

storyBtn.onclick = async () => {

  const topic =
    document.getElementById("topic").value.trim();

  const sceneCount =
    Math.min(
      8,
      Math.max(
        3,
        Number(
          document.getElementById("count").value
        ) || 6
      )
    );

  if(!topic){
    status.textContent = "Lütfen bir konu yaz.";
    return;
  }

  storyBtn.disabled = true;

  imageBtn.classList.add("hidden");
  audioBtn.classList.add("hidden");
  videoBtn.classList.add("hidden");

  storyArea.innerHTML = "";
  results.innerHTML = "";
  audioArea.innerHTML = "";
  videoArea.innerHTML = "";

  generatedImages = [];
  generatedAudio = null;
  currentStory = null;

  setProgress(10);

  status.textContent =
    "✍️ Belgesel senaryosu hazırlanıyor...";

  try{

    const r = await fetch(
      "/.netlify/functions/generate-story",
      {
        method:"POST",
        headers:{
          "content-type":"application/json"
        },
        body:JSON.stringify({
          topic,
          sceneCount
        })
      }
    );

    const raw = await r.text();

    let data;

    try{
      data = JSON.parse(raw);
    }catch{
      throw new Error(
        raw || "Sunucu yanıtı okunamadı."
      );
    }

    if(!r.ok){
      throw new Error(
        (data.error || "Senaryo oluşturulamadı.") +
        (data.detail ? "\n" + data.detail : "")
      );
    }

    if(
      !Array.isArray(data.scenes) ||
      data.scenes.length === 0
    ){
      throw new Error("Sahneler alınamadı.");
    }

    currentStory = data;

    const container =
      document.createElement("div");

    container.className = "story";

    const title =
      document.createElement("h2");

    title.textContent =
      data.title || topic;

    container.appendChild(title);

    data.scenes.forEach((scene,index)=>{

      const box =
        document.createElement("div");

      box.className = "sceneText";

      const n =
        document.createElement("div");

      n.className = "sceneNumber";

      n.textContent =
        `Sahne ${index+1}`;

      const narration =
        document.createElement("div");

      narration.textContent =
        scene.narration || "";

      box.appendChild(n);
      box.appendChild(narration);

      container.appendChild(box);

    });

    storyArea.appendChild(container);

    imageBtn.classList.remove("hidden");

    setProgress(25);

    status.textContent =
      "✅ Senaryo hazır.\nŞimdi tüm görselleri oluşturabilirsin.";

  }catch(error){

    status.textContent =
      "❌ Hata: " + error.message;

    setProgress(0);

  }finally{

    storyBtn.disabled = false;

  }
};


/* =========================================================
   2 — GÖRSELLER
========================================================= */

imageBtn.onclick = async () => {

  if(!currentStory) return;

  storyBtn.disabled = true;
  imageBtn.disabled = true;

  audioBtn.classList.add("hidden");
  videoBtn.classList.add("hidden");

  results.innerHTML = "";
  audioArea.innerHTML = "";
  videoArea.innerHTML = "";

  generatedImages = [];
  generatedAudio = null;

  const topic =
    document.getElementById("topic").value.trim();

  const scenes =
    currentStory.scenes;

  for(let i=0;i<scenes.length;i++){

    status.textContent =
      `🖼️ Görsel ${i+1}/${scenes.length} hazırlanıyor...`;

    setProgress(
      25 +
      Math.round(
        ((i+1)/scenes.length)*30
      )
    );

    try{

      const scene = scenes[i];

      const r = await fetch(
        "/.netlify/functions/generate-image",
        {
          method:"POST",
          headers:{
            "content-type":"application/json"
          },
          body:JSON.stringify({
            topic,
            scene:
              scene.imagePrompt ||
              scene.narration ||
              topic
          })
        }
      );

      if(!r.ok){

        const text =
          await r.text();

        throw new Error(
          text || "Görsel oluşturulamadı."
        );

      }

      const blob =
        await r.blob();

      const url =
        URL.createObjectURL(blob);

      generatedImages.push({
        blob,
        url
      });

      const box =
        document.createElement("div");

      box.className = "scene";

      const img =
        document.createElement("img");

      img.src = url;

      const text =
        document.createElement("div");

      text.className = "sceneText";

      const num =
        document.createElement("div");

      num.className = "sceneNumber";

      num.textContent =
        `Sahne ${i+1}`;

      const narration =
        document.createElement("div");

      narration.textContent =
        scene.narration || "";

      text.appendChild(num);
      text.appendChild(narration);

      box.appendChild(img);
      box.appendChild(text);

      results.appendChild(box);

    }catch(error){

      status.textContent =
        `❌ Sahne ${i+1} hatası: ${error.message}`;

      imageBtn.disabled = false;
      storyBtn.disabled = false;

      return;

    }

  }

  setProgress(55);

  status.textContent =
    "✅ Tüm görseller hazır.";

  audioBtn.classList.remove("hidden");

  imageBtn.disabled = false;
  storyBtn.disabled = false;
};


/* =========================================================
   3 — TEK PARÇA TÜRKÇE SESLENDİRME
========================================================= */

audioBtn.onclick = async () => {

  if(!currentStory) return;

  if(
    generatedImages.length !==
    currentStory.scenes.length
  ){
    status.textContent =
      "Önce bütün görselleri oluştur.";
    return;
  }

  audioBtn.disabled = true;
  storyBtn.disabled = true;
  imageBtn.disabled = true;

  videoBtn.classList.add("hidden");

  audioArea.innerHTML = "";
  videoArea.innerHTML = "";

  generatedAudio = null;

  /*
    Bütün sahnelerin anlatımlarını
    tek metinde birleştiriyoruz.
  */

  const fullNarration =
    currentStory.scenes
      .map(scene =>
        String(scene.narration || "").trim()
      )
      .filter(Boolean)
      .join("\n\n");

  if(!fullNarration){

    status.textContent =
      "❌ Seslendirilecek anlatım bulunamadı.";

    audioBtn.disabled = false;
    storyBtn.disabled = false;
    imageBtn.disabled = false;

    return;
  }

  status.textContent =
    "🎙️ Türkçe anlatım tek parça olarak hazırlanıyor...\nİlk işlem biraz uzun sürebilir.";

  setProgress(65);

  try{

    const r = await fetch(
      "/.netlify/functions/generate-audio",
      {
        method:"POST",
        headers:{
          "content-type":"application/json"
        },
        body:JSON.stringify({
          text:fullNarration
        })
      }
    );

    if(!r.ok){

      const raw =
        await r.text();

      let message = raw;

      try{

        const data =
          JSON.parse(raw);

        message =
          data.error ||
          data.detail ||
          raw;

      }catch{}

      throw new Error(
        message || "Ses üretilemedi."
      );

    }

    const blob =
      await r.blob();

    if(!blob.size){
      throw new Error(
        "Boş ses dosyası alındı."
      );
    }

    generatedAudio = blob;

    const audioURL =
      URL.createObjectURL(blob);

    const audio =
      document.createElement("audio");

    audio.controls = true;
    audio.src = audioURL;

    audioArea.appendChild(audio);

    setProgress(80);

    status.textContent =
      "✅ Türkçe seslendirme hazır.\nÖnce aşağıdaki sesi dinleyebilirsin.";

    videoBtn.classList.remove("hidden");

  }catch(error){

    status.textContent =
      "❌ Seslendirme hatası: " +
      error.message;

    setProgress(55);

  }finally{

    audioBtn.disabled = false;
    storyBtn.disabled = false;
    imageBtn.disabled = false;

  }
};


/* =========================================================
   4 — SHORTS VİDEOSU
========================================================= */

videoBtn.onclick = async () => {

  if(
    !currentStory ||
    generatedImages.length !==
      currentStory.scenes.length ||
    !generatedAudio
  ){
    status.textContent =
      "Önce görselleri ve seslendirmeyi oluştur.";
    return;
  }

  videoBtn.disabled = true;
  storyBtn.disabled = true;
  imageBtn.disabled = true;
  audioBtn.disabled = true;

  videoArea.innerHTML = "";

  status.textContent =
    "🎬 Shorts videosu hazırlanıyor...\nVideo, seslendirme süresi boyunca oluşturulacak.";

  setProgress(82);

  let audioContext = null;

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    await audioContext.resume();

    /*
      Tek WAV dosyasını çözüyoruz.
    */

    const audioArrayBuffer =
      await generatedAudio.arrayBuffer();

    const audioBuffer =
      await audioContext.decodeAudioData(
        audioArrayBuffer.slice(0)
      );

    const totalDuration =
      audioBuffer.duration;

    if(
      !Number.isFinite(totalDuration) ||
      totalDuration <= 0
    ){
      throw new Error(
        "Ses süresi okunamadı."
      );
    }

    /*
      Her
