<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belgesel AI v4.2</title>

<style>
*{box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0b0d;
  color:#f5f5f5;
  margin:0;
  padding:22px
}

.wrap{
  max-width:760px;
  margin:auto
}

h1{margin-bottom:8px}

small{
  color:#999;
  font-size:14px
}

.card{
  background:#151518;
  border:1px solid #2a2a30;
  border-radius:18px;
  padding:18px;
  margin:14px 0
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  font-size:16px
}

input{
  background:#0e0e11;
  color:white;
  margin:8px 0 12px
}

button{
  background:#efefef;
  color:#111;
  font-weight:700;
  cursor:pointer;
  margin-top:10px
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.muted{color:#aaa}

.status{
  margin-top:14px;
  white-space:pre-wrap;
  line-height:1.5
}

.story{
  background:#0e0e11;
  border:1px solid #29292f;
  border-radius:14px;
  padding:14px;
  margin-top:14px
}

.scene{
  margin-top:18px;
  overflow:hidden;
  border-radius:16px;
  background:#0e0e11;
  border:1px solid #29292f
}

.scene img{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  display:block
}

.sceneText{
  padding:14px;
  line-height:1.5
}

.sceneNumber{
  font-weight:800;
  margin-bottom:8px
}

.progress{
  height:8px;
  background:#26262b;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px
}

.progressBar{
  height:100%;
  width:0%;
  background:#eee;
  transition:width .3s
}

audio{
  width:100%;
  margin-top:16px
}

video{
  width:100%;
  border-radius:16px;
  margin-top:16px;
  background:black;
  aspect-ratio:9/16
}

.download{
  display:block;
  text-decoration:none;
  background:#efefef;
  color:#111;
  font-weight:800;
  text-align:center;
  padding:14px;
  border-radius:12px;
  margin-top:12px
}

.hidden{display:none}
</style>
</head>

<body>

<div class="wrap">

<h1>🎬 Belgesel AI <small>v4.2</small></h1>

<p class="muted">
Konuyu yaz. Belgesel AI senaryoyu, sahneleri, dikey görselleri,
Türkçe seslendirmeyi ve Shorts videosunu hazırlasın.
</p>

<div class="card">

<label>Belgesel konusu</label>

<input
id="topic"
value="Tomris Hatun"
placeholder="Örnek: Piri Reis">

<label>Sahne sayısı</label>

<input
id="count"
type="number"
value="6"
min="3"
max="8">

<button id="storyBtn">
1 — HİKÂYE VE SAHNELERİ OLUŞTUR
</button>

<button id="imageBtn" class="hidden">
2 — TÜM GÖRSELLERİ ÜRET
</button>

<button id="audioBtn" class="hidden">
3 — TÜRKÇE SESLENDİRMEYİ HAZIRLA
</button>

<button id="videoBtn" class="hidden">
4 — SHORTS VİDEOSUNU OLUŞTUR
</button>

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<div id="status" class="status muted"></div>

<div id="storyArea"></div>
<div id="results"></div>
<div id="audioArea"></div>
<div id="videoArea"></div>

</div>
</div>

<script>
window.onerror = function(message, source, line, column, error) {
  document.getElementById("status").textContent =
    "JAVASCRIPT HATASI:\n" +
    message +
    "\nSatır: " + line +
    "\nSütun: " + column;
};
const storyBtn = document.getElementById("storyBtn");
const imageBtn = document.getElementById("imageBtn");
const audioBtn = document.getElementById("audioBtn");
const videoBtn = document.getElementById("videoBtn");

const statusEl = document.getElementById("status");
const storyArea = document.getElementById("storyArea");
const results = document.getElementById("results");
const audioArea = document.getElementById("audioArea");
const videoArea = document.getElementById("videoArea");
const progressBar = document.getElementById("progressBar");

let currentStory = null;
let generatedImages = [];
let generatedAudio = null;

function setProgress(value){
  progressBar.style.width = value + "%";
}

function sleep(ms){
  return new Promise(function(resolve){
    setTimeout(resolve,ms);
  });
}


/* =========================
   1 - HİKAYE
========================= */

storyBtn.onclick = async function(){

  const topic = document.getElementById("topic").value.trim();

  const sceneCount = Math.min(
    8,
    Math.max(
      3,
      Number(document.getElementById("count").value) || 6
    )
  );

  if(!topic){
    statusEl.textContent = "Lütfen bir konu yaz.";
    return;
  }

  storyBtn.disabled = true;

  imageBtn.classList.add("hidden");
  audioBtn.classList.add("hidden");
  videoBtn.classList.add("hidden");

  storyArea.innerHTML = "";
  results.innerHTML = "";
  audioArea.innerHTML = "";
  videoArea.innerHTML = "";

  generatedImages = [];
  generatedAudio = null;
  currentStory = null;

  setProgress(10);

  statusEl.textContent =
    "✍️ Belgesel senaryosu hazırlanıyor...";

  try{

    const r = await fetch(
      "/.netlify/functions/generate-story",
      {
        method:"POST",
        headers:{
          "content-type":"application/json"
        },
        body:JSON.stringify({
          topic:topic,
          sceneCount:sceneCount
        })
      }
    );

    const raw = await r.text();

    let data;

    try{
      data = JSON.parse(raw);
    }catch(e){
      throw new Error(raw || "Sunucu yanıtı okunamadı.");
    }

    if(!r.ok){
      throw new Error(
        (data.error || "Senaryo oluşturulamadı.") +
        (data.detail ? "\n" + data.detail : "")
      );
    }

    if(!Array.isArray(data.scenes)){
      throw new Error("Sahneler alınamadı.");
    }

    currentStory = data;

    const container = document.createElement("div");
    container.className = "story";

    const title = document.createElement("h2");
    title.textContent = data.title || topic;

    container.appendChild(title);

    data.scenes.forEach(function(scene,index){

      const box = document.createElement("div");
      box.className = "sceneText";

      const n = document.createElement("div");
      n.className = "sceneNumber";
      n.textContent = "Sahne " + (index+1);

      const narration = document.createElement("div");
      narration.textContent = scene.narration || "";

      box.appendChild(n);
      box.appendChild(narration);

      container.appendChild(box);

    });

    storyArea.appendChild(container);

    imageBtn.classList.remove("hidden");

    setProgress(25);

    statusEl.textContent =
      "✅ Senaryo hazır.\nŞimdi tüm görselleri oluşturabilirsin.";

  }catch(error){

    statusEl.textContent =
      "❌ Hata: " + error.message;

    setProgress(0);

  }finally{

    storyBtn.disabled = false;

  }
};


/* =========================
   2 - GÖRSELLER
========================= */

imageBtn.onclick = async function(){

  if(!currentStory){
    return;
  }

  storyBtn.disabled = true;
  imageBtn.disabled = true;

  audioBtn.classList.add("hidden");
  videoBtn.classList.add("hidden");

  results.innerHTML = "";
  audioArea.innerHTML = "";
  videoArea.innerHTML = "";

  generatedImages = [];
  generatedAudio = null;

  const topic =
    document.getElementById("topic").value.trim();

  const scenes = currentStory.scenes;

  for(let i=0;i<scenes.length;i++){

    statusEl.textContent =
      "🖼️ Görsel " +
      (i+1) +
      "/" +
      scenes.length +
      " hazırlanıyor...";

    setProgress(
      25 +
      Math.round(((i+1)/scenes.length)*30)
    );

    try{

      const scene = scenes[i];

      const r = await fetch(
        "/.netlify/functions/generate-image",
        {
          method:"POST",
          headers:{
            "content-type":"application/json"
          },
          body:JSON.stringify({
            topic:topic,
            scene:
              scene.imagePrompt ||
              scene.narration ||
              topic
          })
        }
      );

      if(!r.ok){

        const errorText = await r.text();

        throw new Error(
          errorText ||
          "Görsel oluşturulamadı."
        );

      }

      const blob = await r.blob();

      const url =
        URL.createObjectURL(blob);

      generatedImages.push({
        blob:blob,
        url:url
      });

      const box =
        document.createElement("div");

      box.className = "scene";

      const img =
        document.createElement("img");

      img.src = url;

      const text =
        document.createElement("div");

      text.className = "sceneText";

      const num =
        document.createElement("div");

      num.className = "sceneNumber";

      num.textContent =
        "Sahne " + (i+1);

      const narration =
        document.createElement("div");

      narration.textContent =
        scene.narration || "";

      text.appendChild(num);
      text.appendChild(narration);

      box.appendChild(img);
      box.appendChild(text);

      results.appendChild(box);

    }catch(error){

      statusEl.textContent =
        "❌ Sahne " +
        (i+1) +
        " hatası: " +
        error.message;

      imageBtn.disabled = false;
      storyBtn.disabled = false;

      return;

    }

  }

  setProgress(55);

  statusEl.textContent =
    "✅ Tüm görseller hazır.";

  audioBtn.classList.remove("hidden");

  imageBtn.disabled = false;
  storyBtn.disabled = false;
};


/* =========================
   3 - TEK SES DOSYASI
========================= */

audioBtn.onclick = async function(){

  if(!currentStory){
    return;
  }

  if(
    generatedImages.length !==
    currentStory.scenes.length
  ){
    statusEl.textContent =
      "Önce bütün görselleri oluştur.";
    return;
  }

  const narrationParts =
    currentStory.scenes
      .map(function(scene){
        return String(
          scene.narration || ""
        ).trim();
      })
      .filter(function(text){
        return text.length > 0;
      });

  if(narrationParts.length === 0){

    statusEl.textContent =
      "❌ Seslendirilecek metin bulunamadı.";

    return;
  }

  /*
    Sahne metinlerinin arasına nokta ve boşluk
    koyuyoruz. TTS doğal bir kısa duraklama yapar.
  */

  const fullNarration =
    narrationParts.join(" ... ");

  generatedAudio = null;

  audioArea.innerHTML = "";
  videoArea.innerHTML = "";

  videoBtn.classList.add("hidden");

  audioBtn.disabled = true;
  storyBtn.disabled = true;
  imageBtn.disabled = true;

  setProgress(65);

  statusEl.textContent =
    "🎙️ Türkçe anlatım tek parça olarak hazırlanıyor...\nLütfen işlem tamamlanana kadar sayfayı kapatma.";

  try{

    const r = await fetch(
      "/.netlify/functions/generate-audio",
      {
        method:"POST",
        headers:{
          "content-type":"application/json"
        },
        body:JSON.stringify({
          text:fullNarration
        })
      }
    );

    if(!r.ok){

      const raw =
        await r.text();

      let message = raw;

      try{

        const data =
          JSON.parse(raw);

        message =
          data.error ||
          data.detail ||
          raw;

      }catch(e){}

      throw new Error(
        message ||
        "Ses üretilemedi."
      );

    }

    const blob =
      await r.blob();

    if(!blob || blob.size === 0){

      throw new Error(
        "Ses servisi boş dosya gönderdi."
      );

    }

    generatedAudio = blob;

    const audioURL =
      URL.createObjectURL(blob);

    const player =
      document.createElement("audio");

    player.controls = true;
    player.preload = "metadata";
    player.src = audioURL;

    audioArea.appendChild(player);

    setProgress(80);

    statusEl.textContent =
      "✅ Türkçe seslendirme hazır.\nAşağıdaki oynatıcıdan sesi dinleyebilirsin.";

    videoBtn.classList.remove("hidden");

  }catch(error){

    generatedAudio = null;

    setProgress(55);

    statusEl.textContent =
      "❌ Seslendirme hatası: " +
      error.message;

  }finally{

    audioBtn.disabled = false;
    storyBtn.disabled = false;
    imageBtn.disabled = false;

  }
};


/* =========================
   4 - SHORTS VİDEOSU
========================= */

videoBtn.onclick = async function(){

  if(
    !currentStory ||
    generatedImages.length !==
      currentStory.scenes.length ||
    !generatedAudio
  ){

    statusEl.textContent =
      "Önce görselleri ve seslendirmeyi oluştur.";

    return;

  }

  if(
    typeof MediaRecorder === "undefined"
  ){

    statusEl.textContent =
      "❌ Bu tarayıcı video kaydını desteklemiyor.";

    return;

  }

  videoBtn.disabled = true;
  storyBtn.disabled = true;
  imageBtn.disabled = true;
  audioBtn.disabled = true;

  videoArea.innerHTML = "";

  setProgress(82);

  statusEl.textContent =
    "🎬 Shorts videosu hazırlanıyor...\nBu işlem seslendirme süresi kadar sürebilir.";

  let audioContext = null;

  try{

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass){

      throw new Error(
        "Bu tarayıcı ses işleme özelliğini desteklemiyor."
      );

    }

    audioContext =
      new AudioContextClass();

    await audioContext.resume();

    const audioArrayBuffer =
      await generatedAudio.arrayBuffer();

    const decodedAudio =
      await audioContext.decodeAudioData(
        audioArrayBuffer.slice(0)
      );

    const totalDuration =
      decodedAudio.duration;

    if(
      !Number.isFinite(totalDuration) ||
      totalDuration <= 0
    ){

      throw new Error(
        "Ses dosyasının süresi okunamadı."
      );

    }

    /*
      Görselleri video başlamadan önce yükle.
    */

    const loadedImages = [];

    for(
      let i=0;
      i<generatedImages.length;
      i++
    ){

      const image =
        await loadImage(
          generatedImages[i].url
        );

      loadedImages.push(image);

    }

    /*
      Her sahnenin yaklaşık konuşma süresini
      metin uzunluğuna göre hesapla.
    */

    const textWeights =
      currentStory.scenes.map(
        function(scene){

          return Math.max(
            1,
            String(
              scene.narration || ""
            ).trim().length
          );

        }
      );

    const totalWeight =
      textWeights.reduce(
        function(total,value){
          return total + value;
        },
        0
      );

    const sceneDurations =
      textWeights.map(
        function(value){

          return (
            totalDuration *
            (value/totalWeight)
          );

        }
      );

    const sceneStarts = [];

    let accumulated = 0;

    for(
      let i=0;
      i<sceneDurations.length;
      i++
    ){

      sceneStarts.push(accumulated);

      accumulated +=
        sceneDurations[i];

    }

    /*
      9:16 Shorts alanı.
    */

    const canvas =
      document.createElement("canvas");

    canvas.width = 540;
    canvas.height = 960;

    const ctx =
      canvas.getContext("2d");

    if(!ctx){

      throw new Error(
        "Video çizim alanı açılamadı."
      );

    }

    drawScene(
      ctx,
      canvas,
      loadedImages[0],
      0
    );

    const canvasStream =
      canvas.captureStream(30);

    const destination =
      audioContext.createMediaStreamDestination();

    const source =
      audioContext.createBufferSource();

    source.buffer =
      decodedAudio;

    const gain =
      audioContext.createGain();

    gain.gain.value = 1;

    source.connect(gain);

    /*
      Bir bağlantı kaydedilen videoya,
      diğer bağlantı telefondan duyulan sese.
    */

    gain.connect(destination);
    gain.connect(audioContext.destination);

    const audioTracks =
      destination.stream.getAudioTracks();

    if(audioTracks.length === 0){

      throw new Error(
        "Video ses kanalı oluşturulamadı."
      );

    }

    canvasStream.addTrack(
      audioTracks[0]
    );

    let mimeType = "";

    const candidates = [
      "video/mp4;codecs=h264,aac",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];

    for(
      let i=0;
      i<candidates.length;
      i++
    ){

      if(
        MediaRecorder.isTypeSupported(
          candidates[i]
        )
      ){

        mimeType =
          candidates[i];

        break;

      }

    }

    if(!mimeType){

      throw new Error(
        "Telefonun tarayıcısında uygun video formatı bulunamadı."
      );

    }

    const recorder =
      new MediaRecorder(
        canvasStream,
        {
          mimeType:mimeType,
          videoBitsPerSecond:5000000
        }
      );

    const chunks = [];

    recorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size > 0
        ){

          chunks.push(
            event.data
          );

        }

      };

    const recorderFinished =
      new Promise(
        function(resolve,reject){

          recorder.onstop =
            function(){
              resolve();
            };

          recorder.onerror =
            function(event){

              reject(
                event.error ||
                new Error(
                  "Video kaydı sırasında hata oluştu."
                )
              );

            };

        }
      );

    recorder.start(1000);

    await sleep(250);

    const videoStart =
      performance.now();

    source.start(0);

    /*
      Tek animasyon döngüsü.
    */

    await new Promise(
      function(resolve){

        function renderFrame(now){

          const elapsed =
            Math.min(
              (now-videoStart)/1000,
              totalDuration
            );

          let sceneIndex =
            sceneDurations.length - 1;

          for(
            let i=0;
            i<sceneDurations.length;
            i++
          ){

            const sceneEnd =
              sceneStarts[i] +
              sceneDurations[i];

            if(
              elapsed <
              sceneEnd
            ){

              sceneIndex = i;
              break;

            }

          }

          const start =
            sceneStarts[sceneIndex];

          const duration =
            Math.max(
              0.1,
              sceneDurations[sceneIndex]
            );

          const localProgress =
            Math.min(
              1,
              Math.max(
                0,
                (elapsed-start) /
                duration
              )
            );

          drawScene(
            ctx,
            canvas,
            loadedImages[sceneIndex],
            localProgress
          );

          setProgress(
            82 +
            Math.round(
              (
                elapsed /
                totalDuration
              ) * 16
            )
          );

          if(
            elapsed <
            totalDuration
          ){

            requestAnimationFrame(
              renderFrame
            );

          }else{

            resolve();

          }

        }

        requestAnimationFrame(
          renderFrame
        );

      }
    );

    /*
      Son ses paketinin MediaRecorder'a
      ulaşması için kısa pay bırak.
    */

    await sleep(500);

    try{
      source.stop();
    }catch(e){}

    recorder.stop();

    await recorderFinished;

    if(chunks.length === 0){

      throw new Error(
        "Video dosyası oluşturulamadı."
      );

    }

    const finalBlob =
      new Blob(
        chunks,
        {
          type:mimeType
        }
      );

    const videoURL =
      URL.createObjectURL(
        finalBlob
      );

    const video =
      document.createElement("video");

    video.controls = true;
    video.playsInline = true;
    video.src = videoURL;

    videoArea.appendChild(
      video
    );

    const extension =
      mimeType.indexOf("mp4") !== -1
      ? "mp4"
      : "webm";

    const link =
      document.createElement("a");

    link.href =
      videoURL;

    link.download =
      "belgesel-shorts." +
      extension;

    link.className =
      "download";

    if(extension === "mp4"){

      link.textContent =
        "⬇️ MP4 VİDEOYU KAYDET";

    }else{

      link.textContent =
        "⬇️ SHORTS VİDEOSUNU KAYDET";

    }

    videoArea.appendChild(
      link
    );

    setProgress(100);

    if(extension === "mp4"){

      statusEl.textContent =
        "✅ Shorts videosu hazır. MP4 olarak kaydedebilirsin.";

    }else{

      statusEl.textContent =
        "✅ Shorts videosu hazır. Telefonun tarayıcısı MP4 kaydını desteklemediği için WebM oluşturuldu. CapCut'a aktarabilirsin.";

    }

  }catch(error){

    statusEl.textContent =
      "❌ Video oluşturma hatası: " +
      error.message;

  }finally{

    if(audioContext){

      try{
        await audioContext.close();
      }catch(e){}

    }

    videoBtn.disabled = false;
    storyBtn.disabled = false;
    imageBtn.disabled = false;
    audioBtn.disabled = false;

  }

};


/* =========================
   YARDIMCI FONKSİYONLAR
========================= */

function loadImage(src){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();

      img.onload =
        function(){
          resolve(img);
        };

      img.onerror =
        function(){

          reject(
            new Error(
              "Video için görsel okunamadı."
            )
          );

        };

      img.src = src;

    }
  );

}


function drawScene(
  ctx,
  canvas,
  img,
  progress
){

  const cw =
    canvas.width;

  const ch =
    canvas.height;

  ctx.fillStyle =
    "#000";

  ctx.fillRect(
    0,
    0,
    cw,
    ch
  );

  const zoom =
    1 +
    progress*0.10;

  const imageRatio =
    img.width /
    img.height;

  const canvasRatio =
    cw /
    ch;

  let sw;
  let sh;

  if(
    imageRatio >
    canvasRatio
  ){

    sh =
      img.height /
      zoom;

    sw =
      sh *
      canvasRatio;

  }else{

    sw =
      img.width /
      zoom;

    sh =
      sw /
      canvasRatio;

  }

  const maxX =
    Math.max(
      0,
      img.width-sw
    );

  const max
