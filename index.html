<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belgesel AI v3.3</title>

<style>
body{
  font-family:system-ui;
  background:#0b0b0d;
  color:#f5f5f5;
  margin:0;
  padding:22px
}
.wrap{max-width:760px;margin:auto}
.card{
  background:#151518;
  border:1px solid #2a2a30;
  border-radius:18px;
  padding:18px;
  margin:14px 0
}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  font-size:16px
}
input{
  background:#0e0e11;
  color:white;
  margin:8px 0 12px
}
button{
  background:#efefef;
  color:#111;
  font-weight:700;
  cursor:pointer;
  margin-top:10px
}
button:disabled{opacity:.5}
.muted{color:#aaa}
.status{
  margin-top:14px;
  white-space:pre-wrap
}
.story{
  background:#0e0e11;
  border:1px solid #29292f;
  border-radius:14px;
  padding:14px;
  margin-top:14px
}
.scene{
  margin-top:18px;
  overflow:hidden;
  border-radius:16px;
  background:#0e0e11;
  border:1px solid #29292f
}
.scene img{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  display:block;
  animation:cameraMove 8s ease-in-out infinite alternate
}
.sceneText{
  padding:14px;
  line-height:1.5
}
.sceneNumber{
  font-weight:700;
  margin-bottom:8px
}
@keyframes cameraMove{
  0%{transform:scale(1)}
  100%{transform:scale(1.12) translateY(-1%)}
}
</style>
</head>

<body>

<div class="wrap">

<h1>🎬 Belgesel AI <small>v3.3</small></h1>

<p class="muted">
Konuyu yaz. AI önce kısa belgesel hikâyesini ve sahneleri hazırlasın,
sonra her sahne için 9:16 görsel üretsin.
</p>

<div class="card">

<label>Belgesel konusu</label>

<input
id="topic"
value="Tomris Hatun"
placeholder="Örnek: Piri Reis">

<label>Sahne sayısı</label>

<input
id="count"
type="number"
value="6"
min="3"
max="8">

<button id="storyBtn">
1 — HİKÂYE VE SAHNELERİ OLUŞTUR
</button>

<div id="status" class="status muted"></div>

<div id="storyArea"></div>

<button id="imageBtn" style="display:none">
2 — TÜM GÖRSELLERİ ÜRET
</button>
<button id="videoBtn" style="display:none">
3 – SHORTS VİDEOSUNU OLUŞTUR
</button>
<div id="results"></div>

</div>

</div>

<script>

const storyBtn=document.getElementById('storyBtn');
const imageBtn=document.getElementById('imageBtn');
const status=document.getElementById('status');
const storyArea=document.getElementById('storyArea');
const results=document.getElementById('results');

let currentStory=null;

storyBtn.onclick=async()=>{

const topic=document.getElementById('topic').value.trim();

const sceneCount=Math.min(
8,
Math.max(
3,
Number(document.getElementById('count').value)||6
)
);

if(!topic){
status.textContent='Lütfen bir konu yaz.';
return;
}

storyBtn.disabled=true;
imageBtn.style.display='none';
storyArea.innerHTML='';
results.innerHTML='';
currentStory=null;

status.textContent='AI belgesel hikâyesini hazırlıyor…';

try{

const r=await fetch(
'/.netlify/functions/generate-story',
{
method:'POST',
headers:{
'content-type':'application/json'
},
body:JSON.stringify({
topic,
sceneCount
})
}
);

const text=await r.text();

let data;

try{
data=JSON.parse(text);
}catch{
throw new Error(text||'Geçersiz sunucu yanıtı');
}

if(!r.ok){
throw new Error(
data.error+
(data.detail ? '\n'+data.detail : '')
);
}

if(!data.scenes || !Array.isArray(data.scenes)){
throw new Error('Sahne listesi alınamadı.');
}

currentStory=data;

const title=document.createElement('div');
title.className='story';

const h=document.createElement('h2');
h.textContent=data.title || topic;

title.appendChild(h);

data.scenes.forEach((s,i)=>{

const box=document.createElement('div');
box.className='sceneText';

const n=document.createElement('div');
n.className='sceneNumber';
n.textContent=`Sahne ${i+1}`;

const narration=document.createElement('div');
narration.textContent=s.narration || '';

box.appendChild(n);
box.appendChild(narration);
title.appendChild(box);

});

storyArea.appendChild(title);

imageBtn.style.display='block';

status.textContent=
'✅ Hikâye hazır. Kontrol ettikten sonra görselleri üretebilirsin.';

}catch(e){

status.textContent='Hata: '+e.message;

}finally{

storyBtn.disabled=false;

}

};


imageBtn.onclick=async()=>{

if(!currentStory) return;

imageBtn.disabled=true;
storyBtn.disabled=true;
results.innerHTML='';

const topic=document.getElementById('topic').value.trim();

const scenes=currentStory.scenes;

for(let i=0;i<scenes.length;i++){

status.textContent=
`Görsel ${i+1}/${scenes.length} hazırlanıyor…`;

try{

const s=scenes[i];

const imagePrompt=
(s.imagePrompt || topic)+
', vertical 9:16 composition, cinematic documentary photography, realistic, highly detailed, no text, no logo, no watermark';

const r=await fetch(
'/.netlify/functions/generate-image',
{
method:'POST',
headers:{
'content-type':'application/json'
},
body:JSON.stringify({
topic,
scene:imagePrompt
})
}
);

if(!r.ok){

const t=await r.text();
throw new Error(t||('HTTP '+r.status));

}

const blob=await r.blob();
const url=URL.createObjectURL(blob);

const box=document.createElement('div');
box.className='scene';

const img=document.createElement('img');
img.src=url;
img.alt=`Sahne ${i+1}`;

const text=document.createElement('div');
text.className='sceneText';

const num=document.createElement('div');
num.className='sceneNumber';
num.textContent=`Sahne ${i+1}`;

const narration=document.createElement('div');
narration.textContent=s.narration || '';

text.appendChild(num);
text.appendChild(narration);

box.appendChild(img);
box.appendChild(text);

results.appendChild(box);

}catch(e){

const err=document.createElement('div');
err.className='story';
err.textContent=
`Sahne ${i+1} görsel hatası: ${e.message}`;

results.appendChild(err);

}

}

status.textContent=
'✅ Hikâye ve tüm görseller hazır.';

imageBtn.disabled=false;
storyBtn.disabled=false;
videoBtn.style.display='block';
};

</script>

</body>
</html>
