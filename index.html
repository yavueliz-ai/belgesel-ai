<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belgesel AI v4.3</title>

<style>
*{box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0b0d;color:#f5f5f5;margin:0;padding:22px
}
.wrap{max-width:760px;margin:auto}
h1{margin-bottom:8px}
small{color:#999;font-size:14px}
.card{
  background:#151518;border:1px solid #2a2a30;
  border-radius:18px;padding:18px;margin:14px 0
}
input,button,select{
  width:100%;padding:14px;border-radius:12px;
  border:1px solid #333;font-size:16px
}
input,select{
  background:#0e0e11;color:white;margin:8px 0 12px
}
button{
  background:#efefef;color:#111;font-weight:700;
  cursor:pointer;margin-top:10px
}
button:disabled{opacity:.45;cursor:not-allowed}
.muted{color:#aaa}
.status{margin-top:14px;white-space:pre-wrap;line-height:1.5}
.story{
  background:#0e0e11;border:1px solid #29292f;
  border-radius:14px;padding:14px;margin-top:14px
}
.scene{
  margin-top:18px;overflow:hidden;border-radius:16px;
  background:#0e0e11;border:1px solid #29292f
}
.scene img{
  width:100%;aspect-ratio:9/16;object-fit:cover;display:block
}
.sceneText{padding:14px;line-height:1.5}
.sceneNumber{font-weight:800;margin-bottom:8px}
.progress{
  height:8px;background:#26262b;border-radius:20px;
  overflow:hidden;margin-top:12px
}
.progressBar{
  height:100%;width:0%;background:#eee;transition:width .3s
}
video{
  width:100%;border-radius:16px;margin-top:16px;
  background:black;aspect-ratio:9/16
}
.download{
  display:block;text-decoration:none;background:#efefef;
  color:#111;font-weight:800;text-align:center;
  padding:14px;border-radius:12px;margin-top:12px
}
.hidden{display:none}
</style>
</head>

<body>

<div class="wrap">

<h1>🎬 Belgesel AI <small>v4.3</small></h1>

<p class="muted">
Konuyu yaz. Belgesel AI senaryoyu, sahneleri, dikey görselleri,
Türkçe seslendirmeyi ve Shorts videosunu hazırlasın.
</p>

<div class="card">

<label>Belgesel konusu</label>
<input id="topic" value="Tomris Hatun" placeholder="Örnek: Piri Reis">

<label>Sahne sayısı</label>
<input id="count" type="number" value="6" min="3" max="8">

<label>Anlatıcı sesi</label>
<select id="voice">
  <option value="nova">Türkçe Anlatıcı</option>
</select>

<button id="storyBtn">1 — HİKÂYE VE SAHNELERİ OLUŞTUR</button>
<button id="imageBtn" class="hidden">2 — TÜM GÖRSELLERİ ÜRET</button>
<button id="audioBtn" class="hidden">3 — TÜRKÇE SESLENDİRMEYİ HAZIRLA</button>
<button id="videoBtn" class="hidden">4 — SHORTS VİDEOSUNU OLUŞTUR</button>

<div class="progress">
  <div id="progressBar" class="progressBar"></div>
</div>

<div id="status" class="status muted"></div>
<div id="storyArea"></div>
<div id="results"></div>
<div id="videoArea"></div>

</div>
</div>

<script>
const storyBtn = document.getElementById("storyBtn");
const imageBtn = document.getElementById("imageBtn");
const audioBtn = document.getElementById("audioBtn");
const videoBtn = document.getElementById("videoBtn");

const statusEl = document.getElementById("status");
const storyArea = document.getElementById("storyArea");
const results = document.getElementById("results");
const videoArea = document.getElementById("videoArea");
const progressBar = document.getElementById("progressBar");

let currentStory = null;
let generatedImages = [];
let generatedAudio = null;

function setStatus(text){
  statusEl.textContent = text;
}

function setProgress(value){
  progressBar.style.width = Math.max(0,Math.min(100,value)) + "%";
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}

async function readError(response){
  const raw = await response.text();

  try{
    const data = JSON.parse(raw);

    return [
      data.error || "",
      data.detail || "",
      data.errorMessage || ""
    ].filter(Boolean).join("\n") || raw;
  }catch{
    return raw || `HTTP ${response.status}`;
  }
}

/* =========================
   1 - HİKÂYE
========================= */

storyBtn.onclick = async function(){

  const topic = document.getElementById("topic").value.trim();

  const sceneCount = Math.min(
    8,
    Math.max(3,Number(document.getElementById("count").value) || 6)
  );

  if(!topic){
    setStatus("Lütfen bir konu yaz.");
    return;
  }

  storyBtn.disabled = true;

  imageBtn.classList.add("hidden");
  audioBtn.classList.add("hidden");
  videoBtn.classList.add("hidden");

  storyArea.innerHTML = "";
  results.innerHTML = "";
  videoArea.innerHTML = "";

  generatedImages.forEach(item=>{
    if(item.url) URL.revokeObjectURL(item.url);
  });

  generatedImages = [];
  generatedAudio = null;
  currentStory = null;

  setProgress(10);
  setStatus("✍️ Belgesel senaryosu hazırlanıyor...");

  try{

    const response = await fetch(
      "/.netlify/functions/generate-story",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          topic:topic,
          sceneCount:sceneCount
        })
      }
    );

    const raw = await response.text();

    let data;

    try{
      data = JSON.parse(raw);
    }catch{
      throw new Error(raw || "Senaryo yanıtı okunamadı.");
    }

    if(!response.ok){
      throw new Error(
        (data.error || "Senaryo oluşturulamadı.") +
        (data.detail ? "\n" + data.detail : "")
      );
    }

    if(!Array.isArray(data.scenes) || data.scenes.length === 0){
      throw new Error("Sunucudan sahne alınamadı.");
    }

    currentStory = data;

    const container = document.createElement("div");
    container.className = "story";

    const title = document.createElement("h2");
    title.textContent = data.title || topic;
    container.appendChild(title);

    data.scenes.forEach(function(scene,index){

      const box = document.createElement("div");
      box.className = "sceneText";

      const number = document.createElement("div");
      number.className = "sceneNumber";
      number.textContent = "Sahne " + (index+1);

      const narration = document.createElement("div");
      narration.textContent = scene.narration || "";

      box.appendChild(number);
      box.appendChild(narration);
      container.appendChild(box);
    });

    storyArea.appendChild(container);

    imageBtn.classList.remove("hidden");

    setProgress(25);
    setStatus("✅ Senaryo hazır.\nŞimdi tüm görselleri oluştur.");

  }catch(error){

    console.error(error);
    setProgress(0);
    setStatus("❌ Senaryo hatası:\n" + error.message);

  }finally{
    storyBtn.disabled = false;
  }
};


/* =========================
   2 - GÖRSELLER
========================= */

imageBtn.onclick = async function(){

  if(!currentStory) return;

  storyBtn.disabled = true;
  imageBtn.disabled = true;

  results.innerHTML = "";

  generatedImages.forEach(item=>{
    if(item.url) URL.revokeObjectURL(item.url);
  });

  generatedImages = [];

  const topic = document.getElementById("topic").value.trim();
  const scenes = currentStory.scenes;

  try{

    for(let i=0;i<scenes.length;i++){

      setStatus(
        `🖼️ Görsel ${i+1}/${scenes.length} hazırlanıyor...`
      );

      setProgress(
        25 + Math.round(((i+1)/scenes.length)*30)
      );

      const scene = scenes[i];

      const response = await fetch(
        "/.netlify/functions/generate-image",
        {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            topic:topic,
            scene:
              scene.imagePrompt ||
              scene.image_prompt ||
              scene.narration ||
              topic
          })
        }
      );

      if(!response.ok){
        throw new Error(
          "Sahne " + (i+1) + ":\n" +
          await readError(response)
        );
      }

      const blob = await response.blob();

      if(!blob.size){
        throw new Error(
          "Sahne " + (i+1) + " için boş görsel döndü."
        );
      }

      const url = URL.createObjectURL(blob);

      generatedImages.push({
        blob:blob,
        url:url
      });

      const box = document.createElement("div");
      box.className = "scene";

      const img = document.createElement("img");
      img.src = url;

      const text = document.createElement("div");
      text.className = "sceneText";

      const number = document.createElement("div");
      number.className = "sceneNumber";
      number.textContent = "Sahne " + (i+1);

      const narration = document.createElement("div");
      narration.textContent = scene.narration || "";

      text.appendChild(number);
      text.appendChild(narration);

      box.appendChild(img);
      box.appendChild(text);

      results.appendChild(box);
    }

    setProgress(55);

    setStatus(
      "✅ Tüm görseller hazır.\nŞimdi Türkçe seslendirmeyi oluştur."
    );

    audioBtn.classList.remove("hidden");

  }catch(error){

    console.error(error);
    setStatus("❌ Görsel hatası:\n" + error.message);

  }finally{

    storyBtn.disabled = false;
    imageBtn.disabled = false;
  }
};


/* =========================
   3 - TEK PARÇA TÜRKÇE SES
========================= */

audioBtn.onclick = async function(){

  if(!currentStory) return;

  if(generatedImages.length !== currentStory.scenes.length){
    setStatus("Önce bütün görselleri oluştur.");
    return;
  }

  audioBtn.disabled = true;
  storyBtn.disabled = true;
  imageBtn.disabled = true;

  generatedAudio = null;

  try{

    /*
      Bütün sahnelerin anlatımı birleştiriliyor.
      Böylece Render'a 6 ayrı istek yerine
      yalnızca 1 seslendirme isteği gönderiliyor.
    */

    const fullNarration = currentStory.scenes
      .map(scene => String(scene.narration || "").trim())
      .filter(Boolean)
      .join("\n\n");

    if(!fullNarration){
      throw new Error("Seslendirilecek metin bulunamadı.");
    }

    setProgress(65);

    setStatus(
      "🎙️ Türkçe seslendirme hazırlanıyor...\n" +
      "Tüm belgesel tek parça seslendiriliyor."
    );

    const response = await fetch(
      "/.netlify/functions/generate-audio",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          text:fullNarration,
          voice:document.getElementById("voice").value
        })
      }
    );

    if(!response.ok){
      throw new Error(await readError(response));
    }

    const blob = await response.blob();

    if(!blob.size){
      throw new Error("Sunucudan boş ses dosyası geldi.");
    }

    generatedAudio = blob;

    setProgress(80);

    setStatus(
      "✅ Türkçe seslendirme hazır.\n" +
      "Şimdi Shorts videosunu oluşturabilirsin."
    );

    videoBtn.classList.remove("hidden");

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Seslendirme hatası:\n" +
      error.message
    );

  }finally{

    audioBtn.disabled = false;
    storyBtn.disabled = false;
    imageBtn.disabled = false;
  }
};


/* =========================
   4 - SHORTS VİDEOSU
========================= */

videoBtn.onclick = async function(){

  if(
    !currentStory ||
    generatedImages.length !== currentStory.scenes.length ||
    !generatedAudio
  ){
    setStatus("Önce görselleri ve seslendirmeyi oluştur.");
    return;
  }

  videoBtn.disabled = true;
  storyBtn.disabled = true;
  imageBtn.disabled = true;
  audioBtn.disabled = true;

  videoArea.innerHTML = "";

  setProgress(82);

  setStatus(
    "🎬 Shorts videosu hazırlanıyor...\n" +
    "Bu işlem yaklaşık video süresi kadar sürer."
  );

  let audioContext = null;

  try{

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass){
      throw new Error("Bu tarayıcı ses işlemeyi desteklemiyor.");
    }

    audioContext = new AudioContextClass();
    await audioContext.resume();

    const audioArrayBuffer =
      await generatedAudio.arrayBuffer();

    const audioBuffer =
      await audioContext.decodeAudioData(
        audioArrayBuffer.slice(0)
      );

    const totalDuration = audioBuffer.duration;

    if(!totalDuration || !isFinite(totalDuration)){
      throw new Error("Ses süresi okunamadı.");
    }

    const loadedImages = [];

    for(const item of generatedImages){
      loadedImages.push(
        await loadImage(item.url)
      );
    }

    /*
      Her görselin ekranda kalma süresi,
      ilgili sahnenin metin uzunluğuna göre
      yaklaşık olarak hesaplanıyor.
    */

    const weights = currentStory.scenes.map(scene=>{
      const text = String(scene.narration || "").trim();
      return Math.max(text.length,1);
    });

    const totalWeight =
      weights.reduce((a,b)=>a+b,0);

    const sceneDurations =
      weights.map(weight =>
        totalDuration * (weight/totalWeight)
      );

    const canvas = document.createElement("canvas");

    canvas.width = 540;
    canvas.height = 960;

    const ctx = canvas.getContext("2d");

    if(!ctx){
      throw new Error("Video tuvali oluşturulamadı.");
    }

    drawScene(
      ctx,
      canvas,
      loadedImages[0],
      0
    );

    const canvasStream =
      canvas.captureStream(30);

    const destination =
      audioContext.createMediaStreamDestination();

    const source =
      audioContext.createBufferSource();

    source.buffer = audioBuffer;

    /*
      Ses hem kayda gider hem telefondan duyulur.
    */

    source.connect(destination);

    const monitorGain =
      audioContext.createGain();

    monitorGain.gain.value = 1;

    source.connect(monitorGain);
    monitorGain.connect(audioContext.destination);

    const audioTracks =
      destination.stream.getAudioTracks();

    if(!audioTracks.length){
      throw new Error("Video ses kanalı oluşturulamadı.");
    }

    canvasStream.addTrack(audioTracks[0]);

    let mimeType = "";

    const candidates = [
      "video/mp4;codecs=h264,aac",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];

    for(const type of candidates){
      if(MediaRecorder.isTypeSupported(type)){
        mimeType = type;
        break;
      }
    }

    if(!mimeType){
      throw new Error(
        "Bu tarayıcı video kaydını desteklemiyor."
      );
    }

    const recorder = new MediaRecorder(
      canvasStream,
      {
        mimeType:mimeType,
        videoBitsPerSecond:5000000
      }
    );

    const chunks = [];

    recorder.ondataavailable = event=>{
      if(event.data && event.data.size){
        chunks.push(event.data);
      }
    };

    const recorderFinished =
      new Promise((resolve,reject)=>{

        recorder.onstop = resolve;

        recorder.onerror = event=>{
          reject(
            event.error ||
            new Error("Video kaydedilemedi.")
          );
        };
      });

    recorder.start(1000);

    /*
      Kayıt başladıktan hemen sonra
      tek parça anlatım başlatılıyor.
    */

    source.start(0);

    const startTime = performance.now();

    await new Promise(resolve=>{

      function render(now){

        const elapsed =
          (now-startTime)/1000;

        let accumulated = 0;
        let sceneIndex = sceneDurations.length-1;
        let localProgress = 1;

        for(let i=0;i<sceneDurations.length;i++){

          const end =
            accumulated + sceneDurations[i];

          if(elapsed <= end){

            sceneIndex = i;

            localProgress =
              sceneDurations[i] > 0
              ? (elapsed-accumulated)/sceneDurations[i]
              : 1;

            localProgress =
              Math.max(
                0,
                Math.min(1,localProgress)
              );

            break;
          }

          accumulated = end;
        }

        drawScene(
          ctx,
          canvas,
          loadedImages[sceneIndex],
          localProgress
        );

        setProgress(
          82 +
          Math.round(
            Math.min(elapsed/totalDuration,1) * 16
          )
        );

        if(elapsed < totalDuration){

          requestAnimationFrame(render);

        }else{

          resolve();
        }
      }

      requestAnimationFrame(render);
    });

    await sleep(500);

    try{
      source.stop();
    }catch{}

    recorder.stop();

    await recorderFinished;

    if(!chunks.length){
      throw new Error("Video verisi oluşturulamadı.");
    }

    const finalBlob =
      new Blob(
        chunks,
        {type:mimeType}
      );

    const videoURL =
      URL.createObjectURL(finalBlob);

    const video =
      document.createElement("video");

    video.controls = true;
    video.playsInline = true;
    video.src = videoURL;

    videoArea.appendChild(video);

    const extension =
      mimeType.includes("mp4")
      ? "mp4"
      : "webm";

    const link =
      document.createElement("a");

    link.href = videoURL;
    link.download =
      "belgesel-shorts." + extension;

    link.className = "download";

    link.textContent =
      extension === "mp4"
      ? "⬇️ MP4 VİDEOYU KAYDET"
      : "⬇️ SHORTS VİDEOSUNU KAYDET";

    videoArea.appendChild(link);

    setProgress(100);

    if(extension === "mp4"){

      setStatus(
        "✅ Shorts videosu hazır.\nMP4 olarak kaydedebilirsin."
      );

    }else{

      setStatus(
        "✅ Shorts videosu hazır.\n" +
        "Telefon tarayıcısı MP4 kaydını desteklemediği için WebM oluşturuldu. " +
        "Bu dosyayı CapCut'a aktarabilirsin."
      );
    }

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Video oluşturma hatası:\n" +
      error.message
    );

  }finally{

    if(audioContext){
      try{
        await audioContext.close();
      }catch{}
    }

    videoBtn.disabled = false;
    storyBtn.disabled = false;
    imageBtn.disabled = false;
    audioBtn.disabled = false;
  }
};


/* =========================
   YARDIMCI FONKSİYONLAR
========================= */

function loadImage(src){

  return new Promise((resolve,reject)=>{

    const img = new Image();

    img.onload = ()=>resolve(img);

    img.onerror = ()=>reject(
      new Error("Video için bir görsel okunamadı.")
    );

    img.src = src;
  });
}


function drawScene(ctx,canvas,img,progress){

  const cw = canvas.width;
  const ch = canvas.height;

  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,cw,ch);

  const zoom =
    1 + progress*0.10;

  const imageRatio =
    img.width/img.height;

  const canvasRatio =
    cw/ch;

  let sw;
  let sh;

  if(imageRatio > canvasRatio){

    sh = img.height/zoom;
    sw = sh*canvasRatio;

  }else{

    sw = img.width/zoom;
    sh = sw/canvasRatio;
  }

  const maxX =
    Math.max(0,img.width-sw);

  const maxY =
    Math.max(0,img.height-sh);

  const sx =
    maxX*(0.35 + progress*0.30);

  const sy =
    maxY*(0.45 - progress*0.10);

  ctx.drawImage(
    img,
    sx,sy,sw,sh,
    0,0,cw,ch
  );

  const gradient =
    ctx.createLinearGradient(
      0,
      ch*0.65,
      0,
      ch
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.25)"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    ch*0.65,
    cw,
    ch*0.35
  );
}
</script>

</body>
</html>
